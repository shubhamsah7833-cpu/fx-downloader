<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FX Instagram & YouTube Downloader</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;padding:24px;display:grid;place-items:center;font-family:system-ui,Segoe UI,sans-serif;color:#fff;background:linear-gradient(135deg,#ff1493,#ff69b4 50%,#7e22ce)}
    .card{width:min(100%,500px);padding:28px;background:rgba(15,15,25,.94);border:1px solid #ff69b4;border-radius:22px;box-shadow:0 20px 60px #0006}
    .icons{font-size:34px;text-align:center;letter-spacing:12px}
    h1{text-align:center;color:#ffb6d9;font-size:24px;margin:10px 0 24px}
    label{display:block;margin:16px 0 8px;color:#fbcfe8;font-weight:650;font-size:14px}
    input[type=url],select{width:100%;padding:14px;border-radius:10px;border:1px solid #ff69b4;background:#242436;color:#fff;font-size:15px}
    .formats{display:flex;gap:12px}
    .format{flex:1;border:1px solid #ff69b4;padding:13px;border-radius:10px;text-align:center;cursor:pointer}
    .format input{margin-right:6px;accent-color:#ff1493}
    button{margin-top:22px;width:100%;padding:15px;border:0;border-radius:10px;background:linear-gradient(135deg,#ff1493,#c026d3);color:white;font-weight:800;font-size:16px;cursor:pointer}
    button:disabled{opacity:.6}
    .msg{margin-top:18px;padding:13px;border:1px dashed #ff69b4;border-radius:10px;overflow-wrap:anywhere;color:#ffd1e7}
    .hint{font-size:12px;line-height:1.5;color:#cbd5e1;text-align:center;margin-top:18px}
  </style>
</head>
<body><main class="card">
  <div class="icons">◎ ▶</div>
  <h1>FX Instagram & YouTube Downloader</h1>
  <form method="post" id="downloadForm">
    <label for="url">🔗 Video link paste karein</label>
    <input id="url" type="url" name="url" placeholder="https://www.youtube.com/..." required>
    <label>🎵 Format select karein</label>
    <div class="formats">
      <label class="format"><input type="radio" name="format_type" value="mp4" checked>🎬 MP4 Video</label>
      <label class="format"><input type="radio" name="format_type" value="mp3">🎧 MP3 Audio</label>
    </div>
    <label for="quality">⚙️ Quality</label>
    <select name="quality" id="quality">
      <option value="best">Best available</option>
      <option value="720">720p (if available)</option>
      <option value="480">480p (if available)</option>
    </select>
    <button id="submitBtn" type="submit">⚡ Download Now</button>
  </form>
  {% if result_msg %}<div class="msg">{{ result_msg }}</div>{% endif %}
  <p class="hint">Sirf apne content ya aise videos download karein jinke liye aapke paas permission ho. Download ke dauran page ko khula rakhein.</p>
</main>
<script>
const radios = document.querySelectorAll('input[name="format_type"]');
const quality = document.getElementById('quality');
function updateQuality(){
  const audio = document.querySelector('input[name="format_type"]:checked').value === 'mp3';
  quality.innerHTML = audio
    ? '<option value="best">Best audio (MP3)</option>'
    : '<option value="best">Best available</option><option value="720">720p (if available)</option><option value="480">480p (if available)</option>';
}
radios.forEach(r => r.addEventListener('change', updateQuality));
document.getElementById('downloadForm').addEventListener('submit', () => {
  const b = document.getElementById('submitBtn'); b.disabled = true; b.textContent = '⏳ Processing…';
});
</script></body></html>
